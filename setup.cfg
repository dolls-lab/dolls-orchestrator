[metadata]
name = dolls-orchestrator
version = 0.1.0
description = Local-first orchestration service for a character voice device
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.extras_require]
mlx =
    mlx-whisper
desktop =
    sounddevice>=0.5
terminal =
    websockets>=15,<16
full =
    mlx-whisper
    sounddevice>=0.5
    websockets>=15,<16

[options.entry_points]
console_scripts =
    dolls-orchestrator = dolls_orchestrator.cli:main
